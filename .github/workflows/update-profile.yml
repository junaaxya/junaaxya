name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    name: Generate GitHub Profile Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Profile Directory
        run: mkdir -p profile

      # ==========================================
      # GITHUB STATISTICS
      # ==========================================

      - name: Generate GitHub Statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=junaaxya&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # TOP PROGRAMMING LANGUAGES
      # ==========================================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=junaaxya&layout=compact&langs_count=8&theme=tokyonight&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # GITHUB TROPHY
      # ==========================================

      - name: Generate GitHub Trophy
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=junaaxya&theme=onedark&column=4&margin-w=15&margin-h=15&no-frame=true'
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      # ==========================================
      # SNAKE CONTRIBUTION ANIMATION
      # ==========================================

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: junaaxya
          outputs: |
            profile/snake.svg?palette=github-dark

      # ==========================================
      # SAVE GENERATED IMAGES
      # ==========================================

      - name: Commit and Push Profile Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg
          git add profile/top-langs.svg
          git add profile/trophy.svg
          git add profile/snake.svg

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub profile assets"
            git push
          fi
